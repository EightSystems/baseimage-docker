name: Build Alpine Base Images
on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "0 0 1,15 * *"
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: eightsystems/baseimage-docker
  DOCKER_IMAGE_NAME: 8sistemas/baseimage
jobs:
  build-images:
    runs-on: ubuntu-latest
    if: (!contains(github.event.head_commit.message, '[skipci]') && !contains(github.event.head_commit.message, '[noci]'))
    strategy:
      max-parallel: 2
      matrix:
        alpine: ["3.20", "3.23", "3.24"]
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log into Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},${{ env.DOCKER_IMAGE_NAME }}
      - name: Build image for smoke test
        uses: docker/build-push-action@v7
        if: github.event_name != 'pull_request'
        with:
          context: ./
          load: true
          build-args: |
            BASE_IMAGE=alpine:${{ matrix.alpine }}
            ALPINE_VERSION=${{ matrix.alpine }}
          file: ./Dockerfile
          tags: ${{ env.DOCKER_IMAGE_NAME }}:alpine-${{ matrix.alpine }}-test
          labels: ${{ steps.meta.outputs.labels }}

      - name: Smoke test image
        if: github.event_name != 'pull_request'
        run: |
          docker run --rm \
            -v "$PWD/tests/ci/image-smoke-test.sh:/smoke-test.sh:ro" \
            -e ALPINE_VERSION="${{ matrix.alpine }}" \
            --entrypoint /bin/sh \
            ${{ env.DOCKER_IMAGE_NAME }}:alpine-${{ matrix.alpine }}-test \
            /smoke-test.sh

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./
          build-args: |
            BASE_IMAGE=alpine:${{ matrix.alpine }}
            ALPINE_VERSION=${{ matrix.alpine }}
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:alpine-${{ matrix.alpine }},${{ env.DOCKER_IMAGE_NAME }}:alpine-${{ matrix.alpine }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true

      - name: Run Security Scan against alpine-${{ matrix.alpine }}
        if: matrix.alpine == '3.24'
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        id: scan
        with:
          image: "ghcr.io/eightsystems/baseimage-docker:alpine-${{ matrix.alpine }}"
          fail-build: false
          severity-cutoff: critical
      - name: Upload Scan Report for alpine-${{ matrix.alpine }}
        if: matrix.alpine == '3.24'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}

      - name: Trivy scan (report) for alpine-${{ matrix.alpine }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scanners: vuln
          image-ref: "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:alpine-${{ matrix.alpine }}"
          format: sarif
          output: trivy-results.sarif
          severity: LOW,MEDIUM,HIGH,CRITICAL
          exit-code: "0"

      - name: Trivy gate (CRITICAL/HIGH) for alpine-${{ matrix.alpine }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scanners: vuln
          image-ref: "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:alpine-${{ matrix.alpine }}"
          severity: CRITICAL,HIGH
          exit-code: "1"

      - name: Upload Trivy report for alpine-${{ matrix.alpine }}
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        continue-on-error: true
        with:
          sarif_file: trivy-results.sarif
          category: trivy-alpine-${{ matrix.alpine }}
