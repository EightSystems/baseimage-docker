name: Build Laravel Alpine Base Images (Alpine 3.20)
on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "0 0 1,15 * *"
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: eightsystems/baseimage-docker
  DOCKER_IMAGE_NAME: 8sistemas/baseimage
jobs:
  build-images:
    runs-on: ubuntu-latest
    if: (!contains(github.event.head_commit.message, '[skipci]') && !contains(github.event.head_commit.message, '[noci]'))
    strategy:
      max-parallel: 4
      matrix:
        php: ["8.3", "8.4"]
        variants: ["mysql", "pgsql", "mysql-nginx", "pgsql-nginx"]
        subvariant: ["", "-xdebug"]
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log into Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},${{ env.DOCKER_IMAGE_NAME }}
      - name: Build image for smoke test
        uses: docker/build-push-action@v7
        if: github.event_name != 'pull_request'
        with:
          context: ./
          load: true
          build-args: |
            BASE_IMAGE=ghcr.io/eightsystems/laravel-alpine:${{matrix.php}}-alpine3.20-${{ matrix.variants }}${{ matrix.subvariant }}
            ALPINE_VERSION=3.20
          file: ./Dockerfile
          tags: ${{ env.DOCKER_IMAGE_NAME }}:laravel-alpine-${{matrix.php}}-alpine3.20-${{ matrix.variants }}${{ matrix.subvariant }}-imagick-test
          labels: ${{ steps.meta.outputs.labels }}

      - name: Smoke test image
        if: github.event_name != 'pull_request'
        run: |
          docker run --rm \
            -v "$PWD/tests/ci/image-smoke-test.sh:/smoke-test.sh:ro" \
            -e ALPINE_VERSION="3.20" \
            --entrypoint /bin/sh \
            ${{ env.DOCKER_IMAGE_NAME }}:laravel-alpine-${{matrix.php}}-alpine3.20-${{ matrix.variants }}${{ matrix.subvariant }}-imagick-test \
            /smoke-test.sh

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./
          build-args: |
            BASE_IMAGE=ghcr.io/eightsystems/laravel-alpine:${{matrix.php}}-alpine3.20-${{ matrix.variants }}${{ matrix.subvariant }}
            ALPINE_VERSION=3.20
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:laravel-alpine-${{matrix.php}}-alpine3.20-${{ matrix.variants }}${{ matrix.subvariant }}-imagick,${{ env.DOCKER_IMAGE_NAME }}:laravel-alpine-${{matrix.php}}-alpine3.20-${{ matrix.variants }}${{ matrix.subvariant }}-imagick
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true

      - name: Trivy scan (report) for laravel-alpine-${{matrix.php}}-alpine3.20-${{ matrix.variants }}${{ matrix.subvariant }}-imagick
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scanners: vuln
          image-ref: "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:laravel-alpine-${{matrix.php}}-alpine3.20-${{ matrix.variants }}${{ matrix.subvariant }}-imagick"
          format: sarif
          output: trivy-results.sarif
          severity: LOW,MEDIUM,HIGH,CRITICAL
          exit-code: "0"

      - name: Trivy gate (CRITICAL/HIGH) for laravel-alpine-${{matrix.php}}-alpine3.20-${{ matrix.variants }}${{ matrix.subvariant }}-imagick
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scanners: vuln
          image-ref: "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:laravel-alpine-${{matrix.php}}-alpine3.20-${{ matrix.variants }}${{ matrix.subvariant }}-imagick"
          severity: CRITICAL,HIGH
          exit-code: "1"

      - name: Upload Trivy report for laravel-alpine-${{matrix.php}}-alpine3.20-${{ matrix.variants }}${{ matrix.subvariant }}-imagick
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        continue-on-error: true
        with:
          sarif_file: trivy-results.sarif
          category: trivy-laravel-alpine-${{matrix.php}}-alpine3.20-${{ matrix.variants }}${{ matrix.subvariant }}-imagick
